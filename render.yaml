databases:
  - name: az-rockmaster-db
    plan: free
    databaseName: azrockmaster
    user: azrockmaster

services:
  - type: web
    name: az-rockmaster-cloud
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && gunicorn azrockmaster.wsgi:application
    healthCheckPath: /accounts/login/
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: az-rockmaster-db
          property: connectionString
