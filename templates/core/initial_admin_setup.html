<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Initial Owner Setup | AZ Rockmaster</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>body{background:#10243a}.panel{max-width:520px;margin:7vh auto;background:#fff;padding:30px;border-radius:16px}.gold{color:#c9a44c}</style></head>
<body><main class="panel"><h3 class="fw-bold">AZ <span class="gold">ROCKMASTER</span></h3><p class="text-secondary">One-time owner account setup</p><div class="alert alert-warning">Create the first administrator account. This page closes automatically after the account is created.</div>{% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label">Setup key</label><input class="form-control" type="password" name="setup_token" autocomplete="off" required></div><div class="mb-3"><label class="form-label">Administrator username</label><input class="form-control" value="azrockmaster" readonly></div><div class="mb-3"><label class="form-label">Email (optional)</label><input class="form-control" type="email" name="email"></div><div class="mb-3"><label class="form-label">Choose password (minimum 12 characters)</label><input class="form-control" type="password" name="password" autocomplete="new-password" minlength="12" required></div><div class="mb-3"><label class="form-label">Confirm password</label><input class="form-control" type="password" name="password_confirm" autocomplete="new-password" minlength="12" required></div><button class="btn btn-dark w-100">Create owner account</button></form></main></body></html>
