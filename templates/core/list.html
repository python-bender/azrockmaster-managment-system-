{% extends "core/base.html" %}{% load field_value %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-3"><h2 class="fw-bold">{{ title }}</h2><a class="btn btn-gold" href="{% url create_url %}">+ Add record</a></div><div class="card p-3 table-responsive"><table class="table align-middle"><thead><tr>{% for c in columns %}<th>{{ c|title }}</th>{% endfor %}</tr></thead><tbody>{% for row in rows %}<tr>{% for c in columns %}<td>{{ row|field_value:c }}</td>{% endfor %}</tr>{% empty %}<tr><td class="text-secondary">No records yet.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
